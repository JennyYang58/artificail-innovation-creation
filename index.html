<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>羊了个羊 · 拾荒远征</title>
<style>
/* ============================================================
   全局样式 —— 自然清新配色：米白 / 浅绿 / 木色
   ============================================================ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: #4a4033;
  background: var(--bg);
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 章节主题：背景 + 主题色（随关卡切换） ---------- */
body[data-chapter="1"] {
  --bg: linear-gradient(165deg, #fdfaf3 0%, #f3f7ec 55%, #eef3e2 100%);
  --accent: #5f8a4c; --accent-2: #82bd6c; --accent-deep: #6a9c56;
}
body[data-chapter="2"] {
  --bg: linear-gradient(165deg, #f2f6ee 0%, #e2ecdf 50%, #d3e3d6 100%);
  --accent: #4c8a63; --accent-2: #6fae86; --accent-deep: #437a56;
}
body[data-chapter="3"] {
  --bg: linear-gradient(165deg, #f8fbff 0%, #eaf3fb 55%, #dcebf7 100%);
  --accent: #4f83a8; --accent-2: #74add0; --accent-deep: #3f6f92;
}
body[data-chapter="4"] {
  --bg: linear-gradient(165deg, #f5f2fb 0%, #eae5f6 55%, #dcd5f0 100%);
  --accent: #7a6cc4; --accent-2: #9c90dd; --accent-deep: #6356a8;
}

/* ---------- 顶部信息栏 ---------- */
#hud {
  flex: none;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 16px 6px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid #e8e2d3;
  box-shadow: 0 2px 12px rgba(170, 150, 115, 0.07);
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #9c907c;
}

.hud-item b {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* ---------- 资源条（仓库 / 金币 / 声望 / 增益） ---------- */
#resbar {
  flex: none;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 12px;
  padding: 5px 12px;
  font-size: 12px;
  color: #9c907c;
  background: rgba(255, 255, 255, 0.55);
  border-bottom: 1px solid #eee7d8;
}

#resbar b {
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.buff-chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: rgba(95, 138, 76, 0.14);
  color: #6d7f5e;
  font-size: 11px;
}

/* ---------- 棋盘区 ---------- */
#board-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 6px;
}

#board {
  position: relative;
  border-radius: 22px;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
}

/* ---------- 底部：槽位 + 暂存区 + 道具 ---------- */
#bottom {
  flex: none;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid #eae4d5;
  box-shadow: 0 -6px 24px rgba(160, 140, 110, 0.1);
}

#slots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  background: #f0e9da;
  border-radius: 14px;
  box-shadow: inset 0 2px 6px rgba(150, 130, 95, 0.12);
}

.slot-cell {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #e4dbc8;
  box-shadow: inset 0 2px 4px rgba(120, 100, 70, 0.12);
}

#stash {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

#stash.hidden { display: none; }

.stash-cell {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #efe4d3;
  border: 1px dashed #d3c4a8;
}

#props {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.prop-btn {
  flex: 1;
  padding: 11px 2px;
  border: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  box-shadow: 0 3px 0 var(--accent-deep), 0 5px 14px rgba(120, 170, 100, 0.32);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease,
              background 0.2s ease, color 0.2s ease;
}

.prop-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 0 0 var(--accent-deep);
}

.prop-btn:disabled {
  background: #ded8ca;
  color: #b0a896;
  box-shadow: none;
  cursor: default;
}

/* ---------- 卡片层（覆盖全屏，用 fixed 定位方便飞行） ---------- */
#card-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

.card {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: linear-gradient(180deg, #fffef9 0%, #f8f2e5 100%);
  border: 1.5px solid #e5dbc7;
  box-shadow: 0 2px 0 rgba(185, 165, 130, 0.4),
              0 3px 8px rgba(150, 130, 100, 0.16);
  pointer-events: auto;
  cursor: pointer;
  will-change: transform;
  transition: transform 0.32s cubic-bezier(0.34, 0.9, 0.4, 1),
              opacity 0.26s ease,
              width 0.15s ease,
              height 0.15s ease,
              font-size 0.15s ease;
}

.card .face {
  display: block;
  line-height: 1;
  transition: transform 0.15s ease;
  pointer-events: none;
}

/* 被遮挡的卡片：变暗 + 禁止点击 */
.card.blocked {
  cursor: default;
}

.card.blocked::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 11px;
  background: rgba(92, 80, 62, 0.46);
  pointer-events: none;
  transition: opacity 0.4s ease;
}

/* 透视效果：遮挡层几乎透明，可看清底牌 */
body.peeking .card.blocked::after { opacity: 0.06; }

/* 点击时的抖动反馈（用于不能点的卡片） */
@keyframes shakeX {
  0%, 100% { margin-left: 0; }
  25% { margin-left: -4px; }
  75% { margin-left: 4px; }
}
.card.shake { animation: shakeX 0.24s ease; }

/* ---------- 飘分文字 ---------- */
.float-text {
  position: fixed;
  transform: translate(-50%, -50%);
  font-size: 22px;
  font-weight: 900;
  color: #f5a623;
  text-shadow: 0 1px 0 #fff, 0 2px 10px rgba(245, 166, 35, 0.6);
  pointer-events: none;
  z-index: 2000;
  white-space: nowrap;
  animation: floatUp 0.95s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}

.float-text small {
  font-size: 15px;
  font-weight: 800;
  color: #7ba05b;
}

@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  25%  { opacity: 1; transform: translate(-50%, -85%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
}

/* ---------- 连击提示（槽位上方，带倒计时条） ---------- */
#combo-badge {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 300;
  padding: 7px 18px 9px;
  border-radius: 999px;
  background: rgba(62, 52, 40, 0.78);
  color: #ffd76a;
  font-size: 14px;
  letter-spacing: 1px;
  text-align: center;
  pointer-events: none;
  box-shadow: 0 4px 14px rgba(60, 48, 30, 0.3);
}

#combo-badge b { font-weight: 800; }

#combo-badge .combo-bar {
  display: block;
  height: 3px;
  margin-top: 4px;
  border-radius: 2px;
  background: #ffd76a;
  width: 100%;
}

#combo-badge.hidden { display: none; }

/* ---------- 简单遮罩层（标题 / 剧情 / 失败 / 章节过场） ---------- */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(62, 52, 40, 0.42);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#overlay.hidden { display: none; }

.overlay-card {
  width: 100%;
  max-width: 340px;
  padding: 30px 24px 26px;
  text-align: center;
  border-radius: 22px;
  background: linear-gradient(180deg, #fffdf8 0%, #f7f2e5 100%);
  box-shadow: 0 22px 55px rgba(80, 62, 40, 0.28);
  animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.ov-emoji {
  font-size: 54px;
  line-height: 1;
  margin-bottom: 12px;
  animation: bob 2.2s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

.overlay-card h2 {
  margin: 0 0 10px;
  font-size: 22px;
  color: var(--accent);
  letter-spacing: 1px;
}

.overlay-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.7;
  color: #9c907c;
  white-space: pre-line;
}

.main-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  box-shadow: 0 4px 0 var(--accent-deep), 0 8px 22px rgba(120, 170, 100, 0.38);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.main-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--accent-deep);
}

/* ---------- 遮罩层次要按钮 ---------- */
.ghost-btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 1.5px solid #d8d0bd;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #9c907c;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ghost-btn:active { background: #f1ecdf; }

#ov-btn2.hidden { display: none; }

/* ============================================================
   功能面板（出发准备 / 三选一构筑 / 回村结算）
   ============================================================ */
#panel {
  position: fixed;
  inset: 0;
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(62, 52, 40, 0.5);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#panel.hidden { display: none; }

.panel-card {
  width: 100%;
  max-width: 380px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 22px 20px 20px;
  border-radius: 22px;
  background: linear-gradient(180deg, #fffdf8 0%, #f7f2e5 100%);
  box-shadow: 0 22px 55px rgba(80, 62, 40, 0.3);
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.panel-card h2 {
  margin: 0 0 4px;
  font-size: 20px;
  color: var(--accent);
  text-align: center;
  letter-spacing: 1px;
}

.panel-card .p-sub {
  margin: 0 0 12px;
  font-size: 12px;
  color: #b0a48e;
  text-align: center;
}

.p-sec {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 800;
  color: #7d7260;
  letter-spacing: 1px;
}

.p-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 7px 2px;
  font-size: 13px;
  color: #6d6252;
  border-bottom: 1px dashed #e8dfcb;
}

.p-row .dim { color: #b0a48e; font-size: 12px; }

.p-btn {
  flex: none;
  padding: 6px 14px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  box-shadow: 0 2px 0 var(--accent-deep);
  cursor: pointer;
}

.p-btn:active { transform: translateY(2px); box-shadow: none; }

.p-btn:disabled {
  background: #ded8ca;
  color: #b0a896;
  box-shadow: none;
  cursor: default;
}

.p-btn.ghost {
  background: #fff;
  color: #8a7f6a;
  border: 1.5px solid #d8d0bd;
  box-shadow: none;
}

.opt-card {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 12px 14px;
  border: 1.5px solid #ddd3bd;
  border-radius: 14px;
  background: #fffdf6;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
}

.opt-card:active { transform: scale(0.98); }
.opt-card:hover { border-color: var(--accent); }

.opt-card .o-name {
  font-size: 15px;
  font-weight: 800;
  color: #5f8a4c;
}

.opt-card .o-desc {
  display: block;
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.6;
  color: #9c907c;
}

.opt-card.locked { opacity: 0.55; cursor: default; }

.opt-card.selected {
  border-color: var(--accent);
  background: #f2f7e8;
  box-shadow: 0 0 0 2px rgba(95, 138, 76, 0.18);
}

.tag {
  display: inline-block;
  padding: 2px 9px;
  margin: 2px 3px 2px 0;
  border-radius: 999px;
  background: rgba(95, 138, 76, 0.13);
  color: #6d7f5e;
  font-size: 12px;
  font-weight: 700;
}

.tag.warn { background: rgba(210, 150, 60, 0.16); color: #a8813d; }
</style>

<body data-chapter="1">

<!-- ==================== 顶部信息栏 ==================== -->
<header id="hud">
  <div class="hud-item"><span>关卡</span><b id="level-val">1</b></div>
  <div class="hud-item"><span>剩余</span><b id="remain-val">0</b></div>
  <div class="hud-item"><span>分数</span><b id="score-val">0</b></div>
  <div class="hud-item"><span>最高分</span><b id="best-val">0</b></div>
</header>

<!-- ==================== 资源条 ==================== -->
<div id="resbar">
  <span>🌾 <b id="res-f">0</b></span>
  <span>⛏️ <b id="res-m">0</b></span>
  <span>✨ <b id="res-r">0</b></span>
  <span>🪙 <b id="res-gold">0</b></span>
  <span>🏅 <b id="res-rep">0</b></span>
  <span id="buffs"></span>
</div>

<!-- ==================== 卡片堆叠区 ==================== -->
<main id="board-wrap">
  <div id="board"></div>
  <div id="combo-badge" class="hidden"><b id="combo-txt">连击 ×2</b><span class="combo-bar"></span></div>
</main>

<!-- ==================== 底部：槽位 / 暂存区 / 道具 ==================== -->
<footer id="bottom">
  <div id="slots"></div>
  <div id="stash" class="hidden"></div>
  <div id="props">
    <button class="prop-btn" data-prop="shuffle" data-label="🔀 洗牌">🔀 洗牌</button>
    <button class="prop-btn" data-prop="undo" data-label="↩️ 撤销">↩️ 撤销</button>
    <button class="prop-btn" data-prop="remove" data-label="📤 移出">📤 移出</button>
  </div>
</footer>

<!-- 卡片渲染层（fixed 定位，覆盖全屏） -->
<div id="card-layer"></div>

<!-- 简单遮罩层：标题 / 剧情 / 失败 / 章节过场 -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <div class="ov-emoji" id="ov-emoji">🐑</div>
    <h2 id="ov-title">羊了个羊 · 拾荒远征</h2>
    <p id="ov-desc"></p>
    <button id="ov-btn" class="main-btn">开始游戏</button>
    <button id="ov-btn2" class="ghost-btn hidden">从头开始</button>
  </div>
</div>

<!-- 功能面板：出发准备 / 三选一构筑 / 回村结算 -->
<div id="panel" class="hidden">
  <div class="panel-card" id="panel-body"></div>
</div>

<script>
/* ================================================================
 *  羊了个羊 · 拾荒远征
 *  ----------------------------------------------------------------
 *  架构说明：
 *    1. 数据层：state.cards 保存所有卡片的逻辑数据（图案、坐标、状态）
 *    2. 渲染层：卡片 DOM 统一放在 #card-layer，transform 定位方便飞行
 *    3. 逻辑层：遮挡判定 / 槽位三消（含万能牌）/ 道具 / 胜负判断
 *    4. 局内构筑：每关出发前从 3 个被动里挑 1 个（改变选择空间，不改数值碾压）
 *    5. 资源三角：图案分属 食物🌾/材料⛏️/符文✨，消除产出资源
 *    6. 轻策略：出发准备（订单目标 / 天气 / 随行伙伴 / 携带道具）
 *    7. 模拟经营：回村交付订单 → 金币 → 升级谷仓/工坊、雇佣伙伴、买道具
 *       —— 经营只影响「下一局的选项和上限」，不做数值碾压
 *    8. 存档：localStorage（进度 / 最高分 / 资源 / 金币 / 声望 / 升级）
 * ================================================================ */

/* ---------------- 章节配置 ----------------
   每 5 关一章，各有专属图案池与配色；
   cats 与 emojis 一一对应：f=食物 m=材料 r=符文 */
const LEVELS_PER_CHAPTER = 5;

const CHAPTERS = [
  {
    name: '青青牧场',
    place: '营地旁的向阳坡地，草料和羊毛最集中。',
    emojis: ['🐑', '🥕', '🍎', '🌻', '🪵', '🧶', '🍄', '🌿'],
    cats:   ['f', 'f', 'f', 'f', 'm', 'm', 'r', 'r'],
  },
  {
    name: '迷雾森林遗迹',
    place: '古代哨塔藏在藤蔓下，木料与古老符文遍地。',
    emojis: ['🐑', '🍓', '🌰', '🍇', '🪵', '🌲', '🍄', '🔮'],
    cats:   ['f', 'f', 'f', 'f', 'm', 'm', 'r', 'r'],
  },
  {
    name: '雪山矿洞',
    place: '风雪之下是废弃矿道，冰晶在岩壁上发亮。',
    emojis: ['🐑', '☕', '🐟', '🧣', '🧤', '🧊', '❄️', '🏔️'],
    cats:   ['f', 'f', 'f', 'm', 'm', 'm', 'r', 'r'],
  },
  {
    name: '月光地下城',
    place: '月亮升起后才开启的地窖，蜂蜜与月光符文共存。',
    emojis: ['🐑', '🍇', '🍯', '🐟', '🪵', '🕯️', '🌙', '🔮'],
    cats:   ['f', 'f', 'f', 'f', 'm', 'm', 'r', 'r'],
  },
];

/** 关卡所属章节（主题按 4 章循环，num 一直递增） */
function chapterOf(level) {
  const idx = Math.floor((level - 1) / LEVELS_PER_CHAPTER) % CHAPTERS.length;
  const num = Math.floor((level - 1) / LEVELS_PER_CHAPTER) + 1;
  return { ...CHAPTERS[idx], index: idx + 1, num };
}

/* ---------------- 资源 / 天气 / 伙伴 / 道具 / 被动 ---------------- */
const RES = {
  f: { icon: '🌾', name: '食物' },
  m: { icon: '⛏️', name: '材料' },

/* ---------------- 常量配置 ---------------- */
const GRID = 7;                 // 棋盘网格边长（每层 7×7 个落点）
const SLOT_COUNT = 7;           // 基础槽位数量
const STASH_COUNT = 3;          // 暂存区数量

const FLY_DURATION = 340;       // 飞入槽位的动画时长（ms）
const COMBO_WINDOW = 5000;      // 连击有效窗口（ms）
const SAVE_KEY = 'sheep_v3_save';      // 新版存档键
const LEGACY_SAVE_KEY = 'sheep_rescue_save_v1'; // 旧版存档键（迁移用）

/* ---------------- 元游戏存档（跨关卡永久保留） ---------------- */
let meta = {
  unlocked: 1, best: 0,
  gold: 0, rep: 0,
  res: { f: 0, m: 0, r: 0 },
  orderCur: null,              // 当前订单 {f,m,r}
  ordersDone: 0,
  upgrades: { barn: 0, workshop: 0 },
  crew: { miner: false, clerk: false },
  items: { peek: 0, guard: 0 },
};

function loadMeta() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      meta.unlocked = Math.max(1, d.unlocked | 0);
      meta.best = Math.max(0, d.best | 0);
      meta.gold = Math.max(0, d.gold | 0);
      meta.rep = Math.max(0, d.rep | 0);
      meta.ordersDone = d.ordersDone | 0;
      for (const c of ['f', 'm', 'r']) meta.res[c] = Math.max(0, (d.res && d.res[c]) | 0);
      if (d.orderCur) meta.orderCur = {
        f: d.orderCur.f | 0, m: d.orderCur.m | 0, r: d.orderCur.r | 0,
      };
      for (const k of ['barn', 'workshop']) meta.upgrades[k] = d.upgrades ? (d.upgrades[k] | 0) : 0;
      for (const k of ['miner', 'clerk']) meta.crew[k] = !!(d.crew && d.crew[k]);
      for (const k of ['peek', 'guard']) meta.items[k] = d.items ? Math.max(0, d.items[k] | 0) : 0;
      return meta;
    }
    // 旧版存档迁移：继承关卡进度与最高分
    const legacy = localStorage.getItem(LEGACY_SAVE_KEY);
    if (legacy) {
      const d = JSON.parse(legacy);
      meta.unlocked = Math.max(1, d.unlocked | 0);
      meta.best = Math.max(0, d.best | 0);
    }
  } catch (e) { /* 存档不可用时静默降级 */ }
  return meta;
}

function saveMeta() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) {}
}

/* 谷仓容量：每种资源的仓库上限 */
function resCap() { return 20 + meta.upgrades.barn * 15; }
/* 工坊加成：随行伙伴偏好类图案的权重倍率 */
function crewMult() { return 1.5 + meta.upgrades.workshop * 0.25; }

/* ---------------- 对局状态（每关重置） ---------------- */
const state = {
  level: 1,
  score: 0,
  cards: [],
  slots: [],
  stash: [],
  history: [],
  propsUsed: {},
  propMax: { shuffle: 1, undo: 1, remove: 1 },
  playing: false,
  S: 42,
  slotCount: SLOT_COUNT,     // 本关槽位数（可被被动 +1）
  comboWindow: COMBO_WINDOW, // 本关连击窗口（雨天 -1s）
  passive: null,             // 本关被动 id
  wildcard: null,            // 万能牌图案
  crewKey: 'farmer',         // 随行伙伴
  weather: 'sunny',          // 本关天气
  carry: { peek: false, guard: false }, // 携带的消耗品
  guardUsed: false,          // 撤回符是否已触发
  gain: { f: 0, m: 0, r: 0 },// 本关入库资源
  overflow: 0,               // 本关因仓库满而损失的资源
  expected: { f: 0, m: 0, r: 0 }, // 本关理论产出
};

let combo = 0;
let lastMatchAt = 0;
let comboTimer = null;
let panelCtx = {};           // 面板临时上下文（出发准备的选择等）

/* ---------------- DOM 引用 ---------------- */
const cardLayer = document.getElementById('card-layer');
const boardEl   = document.getElementById('board');
const boardWrap = document.getElementById('board-wrap');
const slotsEl   = document.getElementById('slots');
const stashEl   = document.getElementById('stash');
const overlayEl = document.getElementById('overlay');
const panelEl   = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');

/* ================================================================
 *  工具函数
 * ================================================================ */

/** Fisher–Yates 洗牌 */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 天气对消除得分的金币倍率（集市日） */
function goldMult() { return state.weather === 'fair' ? 1.5 : 1; }

/** 资源入库（受谷仓容量限制），返回实际入库数 */
function bankRes(cat, n) {
  const cap = resCap();
  const add = Math.min(n, Math.max(0, cap - meta.res[cat]));
  meta.res[cat] += add;
  state.gain[cat] += add;
  state.overflow += n - add;
  return add;
}

/** 把本局收获写回存档（胜/负都会结算） */
function bankAll() {
  for (const c of ['f', 'm', 'r']) bankRes(c, state.gain[c]);
  saveMeta();
}

/** 创建槽位与暂存区的空格子 */
function buildCells() {
  slotsEl.innerHTML = '';
  for (let i = 0; i < state.slotCount; i++) {
    const d = document.createElement('div');
    d.className = 'slot-cell';
    slotsEl.appendChild(d);
  }
  stashEl.innerHTML = '';
  for (let i = 0; i < STASH_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'stash-cell';
    stashEl.appendChild(d);
  }
}

/* ================================================================
 *  关卡生成 —— 纯数据，不涉及 DOM
 *  伙伴偏好：把更多「三连组」分给偏好类图案
 * ================================================================ */

function generateLevel(level, crewCat) {
  const ch = chapterOf(level);
  const pool = ch.emojis;
  const cats = ch.cats;

  /* --- 1. 计算卡片总数与层数 --- */
  let total = 60 + (level - 1) * 18;
  total = Math.min(total, 180);
  total -= total % 3;

  const layers = Math.min(3 + Math.floor((level - 1) / 2), 6);

  /* --- 2. 把卡片数平均分到各层 --- */
  const perLayer = [];
  let left = total;
  for (let i = 0; i < layers; i++) {
    const n = Math.min(Math.ceil(left / (layers - i)), GRID * GRID);
    perLayer.push(n);
    left -= n;
  }

  /* --- 3. 每层一个随机偏移（半格以内），制造层间错位遮挡 --- */
  const layerOffsets = [];
  for (let i = 0; i < layers; i++) {
    layerOffsets.push([
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6,
    ]);
  }

  /* --- 4. 为每层随机挑选网格落点 --- */
  const allCells = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) allCells.push([x, y]);
  }

  const positions = [];
  for (let l = 0; l < layers; l++) {
    const cellPool = shuffle(allCells.slice());
    for (let i = 0; i < perLayer[l]; i++) {
      const [gx, gy] = cellPool[i % cellPool.length];
      positions.push({
        layer: l,
        gx, gy,
        ox: layerOffsets[l][0],
        oy: layerOffsets[l][1],
      });
    }
  }

  /* --- 5. 分配图案：三张一组，按伙伴偏好把组倾斜到对应类别 --- */
  const totalCards = positions.length;
  const triples = totalCards / 3;
  const kinds = Math.max(3, Math.min(pool.length, Math.round(triples / 3.5)));

  // 每种图案基础组数（尽量平均）
  const groups = new Array(kinds).fill(0);
  for (let i = 0; i < triples; i++) groups[i % kinds]++;

  // 伙伴偏好：把一部分组从其他类别挪到偏好类别
  if (crewCat) {
    const favIdx = [], otherIdx = [];
    for (let k = 0; k < kinds; k++) (cats[k] === crewCat ? favIdx : otherIdx).push(k);
    if (favIdx.length && otherIdx.length) {
      let move = Math.floor(triples * 0.18);
      let fi = 0;
      otherIdx.sort((a, b) => groups[b] - groups[a]); // 从最多的开始拿
      while (move > 0) {
        const donor = otherIdx.find(k => groups[k] > 1);
        if (donor === undefined) break;
        groups[donor]--;
        groups[favIdx[fi % favIdx.length]]++;
        fi++;
        move--;
      }
    }
  }

  const emojiList = [];
  for (let i = 0; i < kinds; i++) {
    for (let j = 0; j < groups[i] * 3; j++) emojiList.push(pool[i]);
  }
  shuffle(emojiList);

  /* --- 6. 理论产出（每张牌消除时折算 1 资源） --- */
  const expected = { f: 0, m: 0, r: 0 };
  for (let i = 0; i < kinds; i++) expected[cats[i]] += groups[i] * 3;

  /* --- 7. 组装卡片数据 --- */
  const cards = positions.map((p, i) => ({
    id: i,
    emoji: emojiList[i],
    layer: p.layer,
    gx: p.gx,
    gy: p.gy,
    ox: p.ox,
    oy: p.oy,
    state: 'board',   // board | slot | stash | removed
    blocked: false,
    el: null,
  }));
  return { cards, expected };
}

/* ================================================================
 *  尺寸计算与布局
 * ================================================================ */

function computeSizes() {
  const wrapW = boardWrap.clientWidth - 12;
  const wrapH = boardWrap.clientHeight - 12;

  const slotAvail = Math.min(window.innerWidth - 32, 420);
  const gap = 6;
  const sFromSlot = Math.floor((slotAvail - gap * (state.slotCount - 1) - 16) / state.slotCount);

  let S = Math.floor(Math.min(wrapW / 7.6, wrapH / 7.6, sFromSlot));
  S = Math.max(24, Math.min(54, S));

  state.S = S;

  boardEl.style.width = S * GRID + 'px';
  boardEl.style.height = S * GRID + 'px';

  document.querySelectorAll('.slot-cell, .stash-cell').forEach(el => {
    el.style.width = S + 'px';
    el.style.height = S + 'px';
  });

  for (const card of state.cards) {
    if (!card.el) continue;
    card.el.style.width = S + 'px';
    card.el.style.height = S + 'px';
    card.el.style.fontSize = Math.round(S * 0.56) + 'px';
  }
}

function positionAll(instant = false) {
  const S = state.S;
  const br = boardEl.getBoundingClientRect();

  const slotRects  = [...document.querySelectorAll('.slot-cell')].map(el => el.getBoundingClientRect());
  const stashRects = [...document.querySelectorAll('.stash-cell')].map(el => el.getBoundingClientRect());

  if (instant) {
    for (const c of state.cards) if (c.el) c.el.style.transition = 'none';
  }

  for (const card of state.cards) {
    if (card.state === 'removed' || !card.el) continue;
    const el = card.el;

    let x = 0, y = 0, z = 0;

    if (card.state === 'board') {
      x = br.left + card.gx * S + card.ox * S;
      y = br.top  + card.gy * S + card.oy * S;
      z = 10 + card.layer * 10;
    } else if (card.state === 'slot') {
      const i = state.slots.indexOf(card);
      const r = slotRects[i];
      if (r) { x = r.left; y = r.top; }
      z = 600 + i;
    } else if (card.state === 'stash') {
      const i = state.stash.indexOf(card);
      const r = stashRects[i];
      if (r) { x = r.left; y = r.top; }
      z = 500 + i;
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.zIndex = z;
  }

  if (instant) {
    requestAnimationFrame(() => {
      for (const c of state.cards) if (c.el) c.el.style.transition = '';
    });
  }
}

/* ================================================================
 *  遮挡判定
 * ================================================================ */

function isCardBlocked(card, boardCards) {
  for (const other of boardCards) {
    if (other === card) continue;
    if (other.layer <= card.layer) continue;

    const ax = card.gx + card.ox,  ay = card.gy + card.oy;
    const bx = other.gx + other.ox, by = other.gy + other.oy;

    const dx = Math.min(ax + 1, bx + 1) - Math.max(ax, bx);
    const dy = Math.min(ay + 1, by + 1) - Math.max(ay, by);

    if (dx > 0 && dy > 0 && dx * dy > OVERLAP_THRESHOLD) return true;
  }
  return false;
}

function updateBlocked() {
  const boardCards = state.cards.filter(c => c.state === 'board');
  for (const card of boardCards) {
    const blocked = isCardBlocked(card, boardCards);
    card.blocked = blocked;
    if (card.el) card.el.classList.toggle('blocked', blocked);
  }
}

/* ================================================================
 *  槽位逻辑（含万能牌）
 * ================================================================ */

function insertIntoSlot(card) {
  let idx = -1;
  for (let i = state.slots.length - 1; i >= 0; i--) {
    if (state.slots[i].emoji === card.emoji) { idx = i; break; }
  }
  if (idx === -1) state.slots.push(card);
  else state.slots.splice(idx + 1, 0, card);
}

let resolveTimer = null;

function scheduleResolve() {
  clearTimeout(resolveTimer);
  resolveTimer = setTimeout(() => {
    resolveTimer = null;
    resolveSlots();
  }, FLY_DURATION);
}

/** 找出一组可消除的三张牌（普通三连 或 两张 + 万能牌） */
function findMatch() {
  const count = {};
  for (const c of state.slots) count[c.emoji] = (count[c.emoji] || 0) + 1;

  // 普通三连
  for (const e in count) {
    if (count[e] >= 3) {
      const matched = [];
      for (const c of state.slots) {
        if (c.emoji === e && matched.length < 3) matched.push(c);
      }
      return { matched, kind: e, wild: null };
    }
  }

  // 两张 + 万能牌（万能牌自身不参与普通三连判断）
  if (state.wildcard) {
    for (const e in count) {
      if (e === state.wildcard || count[e] !== 2) continue;
      const wildCard = state.slots.find(c => c.emoji === state.wildcard);
      if (!wildCard) continue;
      const pair = [];
      for (const c of state.slots) {
        if (c.emoji === e && pair.length < 2) pair.push(c);
      }
      return { matched: [...pair, wildCard], kind: e, wild: wildCard };
    }
  }
  return null;
}

function resolveSlots() {
  if (!state.playing && state.cards.length === 0) return;

  const match = findMatch();

  if (match) {
    const { matched, kind, wild } = match;
    state.slots = state.slots.filter(c => !matched.includes(c));

    for (const c of matched) {
      c.state = 'removed';
      c.el.style.transform += ' scale(0.15)';
      c.el.style.opacity = '0';
      c.el.style.pointerEvents = 'none';
    }

    /* ---- 连击与得分 ---- */
    const now = Date.now();
    combo = (now - lastMatchAt <= state.comboWindow) ? combo + 1 : 1;
    lastMatchAt = now;

    let mult = Math.pow(2, Math.min(combo - 1, 3));
    if (state.passive === 'flow' && mult < 2) mult = 2;      // 连击心流：保底 ×2
    const slotMult = state.passive === 'slot' ? 0.8 : 1;      // 宽宏槽位：得分 ×0.8
    const points = Math.round(30 * mult * slotMult);
    state.score += points;
    if (state.score > meta.best) {
      meta.best = state.score;
      saveMeta();
    }

    /* ---- 资源产出 ---- */
    const ch = chapterOf(state.level);
    const idx = ch.emojis.indexOf(kind);
    const cat = ch.cats[idx] || 'f';
    let gainN = 3;
    if (state.passive === 'harvest') gainN += 1;              // 丰收之手
    if (state.weather === 'rain' && cat === 'f') gainN += 1;  // 雨天食物 +
    bankRes(cat, gainN);

    /* ---- 飘字 ---- */
    const sr = slotsEl.getBoundingClientRect();
    const bits = [`+${points}`];
    if (combo > 1) bits.push(`连击×${combo}`);
    showFloat(
      `${bits.join(' ')} <small>+${gainN} ${RES[cat].icon}${wild ? ' 🃏' : ''}</small>`,
      sr.left + sr.width / 2, sr.top - 6
    );
    if (combo > 1) showComboBadge(combo);

    updateHUD();

    setTimeout(() => {
      matched.forEach(c => { c.el.remove(); c.el = null; });
      positionAll();
      updateHUD();
      afterResolve();
      if (state.slots.length >= 3) resolveSlots();
    }, 300);

  } else {
    afterResolve();
  }
}

/** 结算后的胜负判断（撤回符可拦截一次失败） */
function afterResolve() {
  if (!state.playing) return;

  const remaining = state.cards.filter(c => c.state !== 'removed').length;
  if (remaining === 0) {
    winLevel();
    return;
  }
  if (state.slots.length >= state.slotCount) {
    // 撤回符：自动退回最后 3 张，拦截一次失败
    if (state.carry.guard && !state.guardUsed) {
      state.guardUsed = true;
      saveMeta(); // 消耗记入存档
      const back = state.slots.splice(-3);
      for (const card of back) restoreToBoard(card);
      const sr = slotsEl.getBoundingClientRect();
      showFloat('<small>🧿 撤回符生效！</small>', sr.left + sr.width / 2, sr.top - 40);
      updateBlocked();
      positionAll();
      updateHUD();
      return;
    }
    loseLevel();
  }
}

/** 把一张槽位中的牌退回棋盘（优先原位，否则找空位） */
function restoreToBoard(card) {
  // 找它最近的点击历史
  for (let i = state.history.length - 1; i >= 0; i--) {
    if (state.history[i].card === card) {
      const rec = state.history.splice(i, 1)[0];
      card.gx = rec.gx; card.gy = rec.gy;
      card.ox = rec.ox; card.oy = rec.oy;
      card.layer = rec.layer;
      card.state = 'board';
      return;
    }
  }
  // 没有历史（从暂存区点回的）：找一个空闲落点
  const occupied = new Set(
    state.cards.filter(c => c.state === 'board')
      .map(c => c.layer + ':' + c.gx + ',' + c.gy)
  );
  outer:
  for (let l = 0; l < 6; l++) {
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        if (!occupied.has(l + ':' + x + ',' + y)) {
          card.layer = l; card.gx = x; card.gy = y;
          card.ox = 0; card.oy = 0;
          card.state = 'board';
          break outer;
        }
      }
    }
  }
}

/* ================================================================
 *  飘分文字 / 连击提示
 * ================================================================ */
function showFloat(html, x, y) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.innerHTML = html;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function showComboBadge(n) {
  const badge = document.getElementById('combo-badge');
  const txt = document.getElementById('combo-txt');
  const bar = badge.querySelector('.combo-bar');

  txt.textContent = `连击 ×${n}`;
  badge.classList.remove('hidden');

  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => {
    bar.style.transition = `width ${state.comboWindow}ms linear`;
    bar.style.width = '0%';
  });

  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => badge.classList.add('hidden'), state.comboWindow);
}

/* ================================================================
 *  HUD
 * ================================================================ */
function updateHUD() {
  document.getElementById('level-val').textContent = state.level;
  document.getElementById('remain-val').textContent =
    state.cards.filter(c => c.state !== 'removed').length;
  document.getElementById('score-val').textContent = state.score;
  document.getElementById('best-val').textContent = meta.best;

  document.getElementById('res-f').textContent = meta.res.f;
  document.getElementById('res-m').textContent = meta.res.m;
  document.getElementById('res-r').textContent = meta.res.r;
  document.getElementById('res-gold').textContent = meta.gold;
  document.getElementById('res-rep').textContent = meta.rep;

  // 增益徽章
  const chips = [];
  if (state.crewKey) {
    chips.push(`${CREWS[state.crewKey].icon} ${CREWS[state.crewKey].name}`);
  }
  const w = WEATHERS.find(w => w.key === state.weather);
  if (w && w.key !== 'sunny') chips.push(`${w.icon} ${w.name}`);
  if (state.passive) chips.push(`${PASSIVES[state.passive].icon} ${PASSIVES[state.passive].name}`);
  if (state.wildcard) chips.push(`🃏 万能:${state.wildcard}`);
  document.getElementById('buffs').innerHTML =
    chips.map(t => `<span class="buff-chip">${t}</span>`).join('');
}

function updateProps() {
  document.querySelectorAll('.prop-btn').forEach(btn => {
    const key = btn.dataset.prop;
    const used = state.propsUsed[key] || 0;
    const max = state.propMax[key] || 1;
    btn.disabled = !state.playing || used >= max;
    const left = max - used;
    btn.innerHTML = btn.dataset.label + (left > 1 ? ` ×${left}` : '');
  });
}

/* ================================================================
 *  卡片交互
 * ================================================================ */

let overlayHiddenAt = 0; // 防止弹窗关闭瞬间误点卡片

function onCardClick(card) {
  if (!state.playing) return;
  if (Date.now() - overlayHiddenAt < 250) return;
  if (Date.now() - panelHiddenAt < 250) return;

  if (card.state === 'board') {
    handleBoardCardClick(card);
  } else if (card.state === 'stash') {
    handleStashCardClick(card);
  }
}

function handleBoardCardClick(card) {
  if (card.blocked) {
    card.el.classList.remove('shake');
    void card.el.offsetWidth;
    card.el.classList.add('shake');
    setTimeout(() => card.el.classList.remove('shake'), 260);
    return;
  }

  if (state.slots.length >= state.slotCount) return;

  state.history.push({
    card,
    gx: card.gx, gy: card.gy,
    ox: card.ox, oy: card.oy,
    layer: card.layer,
  });

  const face = card.el.querySelector('.face');
  if (face) {
    face.style.transform = 'scale(1.3)';
    setTimeout(() => { if (face) face.style.transform = ''; }, 150);
  }

  card.state = 'slot';
  insertIntoSlot(card);

  updateBlocked();
  positionAll();
  updateHUD();
  scheduleResolve();
}

function handleStashCardClick(card) {
  if (state.slots.length >= state.slotCount) return;

  const i = state.stash.indexOf(card);
  if (i === -1) return;
  state.stash.splice(i, 1);

  card.state = 'slot';
  insertIntoSlot(card);

  if (state.stash.length === 0) {
    stashEl.classList.add('hidden');
    requestAnimationFrame(() => {
      computeSizes();
      positionAll();
    });
  }

  updateBlocked();
  positionAll();
  updateHUD();
  scheduleResolve();
}

/* ================================================================
 *  道具系统
 * ================================================================ */

function useShuffle() {
  if (!state.playing) return;
  if ((state.propsUsed.shuffle || 0) >= (state.propMax.shuffle || 1)) return;

  const boardCards = state.cards.filter(c => c.state === 'board');
  if (boardCards.length < 2) return;

  state.propsUsed.shuffle = (state.propsUsed.shuffle || 0) + 1;

  const emojis = boardCards.map(c => c.emoji);
  shuffle(emojis);

  boardCards.forEach((c, i) => {
    c.emoji = emojis[i];
    const face = c.el.querySelector('.face');
    if (face) face.textContent = emojis[i];
    c.el.style.transform += ' scale(0.85)';
    setTimeout(() => {
      c.el.style.transform = c.el.style.transform.replace(' scale(0.85)', '');
    }, 150);
  });

  state.history = state.history.filter(h => h.card.state === 'board');
  updateProps();
  updateBlocked();
}

function useUndo() {
  if (!state.playing) return;
  if ((state.propsUsed.undo || 0) >= (state.propMax.undo || 1)) return;
  if (state.slots.length === 0) return;

  let rec = null;
  while (state.history.length) {
    const r = state.history[state.history.length - 1];
    if (state.slots.includes(r.card)) { rec = state.history.pop(); break; }
    state.history.pop();
  }
  if (!rec) return;

  state.propsUsed.undo = (state.propsUsed.undo || 0) + 1;

  const card = rec.card;
  const idx = state.slots.indexOf(card);
  if (idx !== -1) state.slots.splice(idx, 1);

  card.state = 'board';
  card.gx = rec.gx; card.gy = rec.gy;
  card.ox = rec.ox; card.oy = rec.oy;
  card.layer = rec.layer;

  updateBlocked();
  positionAll();
  updateHUD();
  updateProps();
}

function useRemove() {
  if (!state.playing) return;
  if ((state.propsUsed.remove || 0) >= (state.propMax.remove || 1)) return;
  if (state.slots.length === 0) return;

  state.propsUsed.remove = (state.propsUsed.remove || 0) + 1;

  const moving = state.slots.splice(0, Math.min(3, state.slots.length));
  moving.forEach(c => {
    c.state = 'stash';
    state.stash.push(c);
  });

  stashEl.classList.remove('hidden');

  requestAnimationFrame(() => {
    computeSizes();
    positionAll();
  });

  updateBlocked();
  updateHUD();
  updateProps();
}

/* ================================================================
 *  遮罩层（简单流程：标题 / 剧情 / 失败 / 章节过场）
 * ================================================================ */

let overlayShownAt = 0;

function showOverlay({ emoji, title, desc, btnText, onClick, btn2Text, onClick2 }) {
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-desc').textContent = desc;

  const btn = document.getElementById('ov-btn');
  btn.textContent = btnText;
  const fresh = btn.cloneNode(true);
  btn.parentNode.replaceChild(fresh, btn);
  const guard = fn => () => {
    if (Date.now() - overlayShownAt < 300) return;
    overlayHiddenAt = Date.now();
    fn();
  };
  fresh.addEventListener('click', guard(onClick));

  const btn2 = document.getElementById('ov-btn2');
  const fresh2 = btn2.cloneNode(true);
  btn2.parentNode.replaceChild(fresh2, btn2);
  if (btn2Text) {
    fresh2.textContent = btn2Text;
    fresh2.addEventListener('click', guard(onClick2));
    fresh2.classList.remove('hidden');
  } else {
    fresh2.classList.add('hidden');
  }

  overlayEl.classList.remove('hidden');
}

function hideOverlay() {
  overlayEl.classList.add('hidden');
}

/* ================================================================
 *  功能面板（出发准备 / 三选一 / 回村）
 * ================================================================ */

let panelHiddenAt = 0;

function openPanel(html) {
  panelBody.innerHTML = html;
  panelEl.classList.remove('hidden');
  panelBody.scrollTop = 0;
}

function closePanel() {
  panelEl.classList.add('hidden');
  panelHiddenAt = Date.now();
}

/* ---------- 订单 ---------- */
function newOrder(level) {
  // 只要求当前关卡「产得出」的资源，需求量约为该类理论产出的 40%~75%
  const est = estimateYield(level, null);
  const avail = ['f', 'm', 'r'].filter(c => est[c] >= 6);
  const factors = shuffle([0.75, 0.55, 0.4]);
  const order = { f: 0, m: 0, r: 0 };
  avail.forEach((c, i) => {
    order[c] = Math.max(3, Math.round(est[c] * factors[i] / 3) * 3);
  });
  if (!avail.length) order.f = 6; // 兜底
  return order;
}

function orderReward(order) {
  const base = (order.f + order.m + order.r) * 3 + 10;
  return Math.round(base * goldMult());
}

function canDeliver(order) {
  return ['f', 'm', 'r'].every(c => meta.res[c] >= order[c]);
}

/* ---------- 出发准备 ---------- */
function rollWeather() {
  const r = Math.random();
  if (r < 0.45) return 'sunny';
  if (r < 0.75) return 'rain';
  return 'fair';
}

function toPrep(level) {
  state.level = level;
  state.weather = rollWeather();
  if (!meta.orderCur) {
    meta.orderCur = newOrder(level);
    saveMeta();
  }
  panelCtx = {
    level,
    crewKey: panelCtx.crewKey || 'farmer',
    carry: { peek: false, guard: false },
  };
  // 章节切换的剧情过场
  const prev = level > 1 ? chapterOf(level - 1) : null;
  const cur = chapterOf(level);
  if (prev && prev.num !== cur.num) {
    showChapterIntro(cur, level);
    return;
  }
  openPrep();
}

function showChapterIntro(ch, level) {
  const emoji = ['🌾', '🌲', '🏔️', '🌙'][ch.index - 1];
  showOverlay({
    emoji,
    title: `第 ${ch.num} 章 · ${ch.name}`,
    desc: ch.place + '\n\n「打包好装备，小队出发！」',
    btnText: '查看任务',
    onClick: () => { hideOverlay(); openPrep(); },
  });
}

function estimateYield(level, crewCat) {
  const ch = chapterOf(level);
  const total = Math.min(60 + (level - 1) * 18, 180);
  const triples = Math.floor(total / 3);
  const kinds = Math.max(3, Math.min(ch.emojis.length, Math.round(triples / 3.5)));
  const base = triples / kinds * 3;
  const est = { f: 0, m: 0, r: 0 };
  for (let k = 0; k < kinds; k++) est[ch.cats[k]] += base;
  // 伙伴偏好：约 18% 的组被挪到偏好类
  if (crewCat && est[crewCat] > 0) {
    const moved = Math.floor(triples * 0.18) * 3;
    const donors = ['f', 'm', 'r'].filter(c => c !== crewCat);
    for (const d of donors) {
      const take = Math.min(est[d] - Math.round(base), Math.floor(moved / donors.length));
      if (take > 0) { est[d] -= take; est[crewCat] += take; }
    }
  }
  for (const c of ['f', 'm', 'r']) est[c] = Math.round(est[c]);
  return est;
}

function openPrep() {
  const level = panelCtx.level;
  const ch = chapterOf(level);
  const w = WEATHERS.find(x => x.key === state.weather);
  const o = meta.orderCur || newOrder(level);
  const est = estimateYield(level, panelCtx.crewKey);
  const reward = orderReward(o);

  const crewBtns = Object.entries(CREWS).map(([key, c]) => {
    const owned = c.owned || meta.crew[key];
    const sel = panelCtx.crewKey === key;
    return `<button class="opt-card ${owned ? '' : 'locked'} ${sel ? 'selected' : ''}"
      data-act="${owned ? 'crew' : 'hint'}" data-arg="${key}">
      <span class="o-name">${c.icon} ${c.name}${sel ? ' ✔' : ''}</span>
      <span class="o-desc">${c.desc}${owned ? '' : ` · 未雇佣（回村客栈雇佣 ${c.cost}🪙）`}</span>
    </button>`;
  }).join('');

  const itemRows = Object.entries(ITEMS).map(([key, it]) => {
    const n = meta.items[key] || 0;
    const carried = panelCtx.carry[key];
    return `<div class="p-row">
      <span>${it.icon} ${it.name} <span class="dim">×${n} · ${it.desc}</span></span>
      <button class="p-btn ${carried ? 'ghost' : ''}" data-act="item" data-arg="${key}"
        ${n <= 0 ? 'disabled' : ''}>${carried ? '已携带 ✔' : '携带'}</button>
    </div>`;
  }).join('');

  openPanel(`
    <h2>远征准备 · 第 ${level} 关</h2>
    <p class="p-sub">${ch.name}</p>

    <div class="p-sec">${w.icon} 天气 · ${w.name}</div>
    <div class="p-row"><span>${w.desc}</span></div>

    <div class="p-sec">📜 当前订单（回村交付）</div>
    <div class="p-row">
      <span>🌾×${o.f}　⛏️×${o.m}　✨×${o.r}</span>
      <span class="dim">报酬 ${reward}🪙 +2🏅</span>
    </div>

    <div class="p-sec">🎒 本关预计产出（伙伴：${CREWS[panelCtx.crewKey].name}）</div>
    <div class="p-row">
      <span>🌾 约${est.f}　⛏️ 约${est.m}　✨ 约${est.r}</span>
      <span class="dim">谷仓上限 ${resCap()}/类</span>
    </div>

    <div class="p-sec">🧑‍🌾 选择随行伙伴（影响本关图案产出）</div>
    ${crewBtns}

    <div class="p-sec">🧿 携带道具</div>
    ${itemRows}

    <button class="main-btn" style="margin-top:16px" data-act="go">出 发 ！</button>
    <p class="p-sub" style="margin-top:10px">出发后会随机出现 3 项被动，选 1 项生效本关</p>
  `);
}

/* ---------- 三选一构筑 ---------- */
function openPassivePick() {
  const ids = shuffle(Object.keys(PASSIVES)).slice(0, 3);
  panelCtx.passiveIds = ids;
  const cards = ids.map(id => {
    const p = PASSIVES[id];

}

/* ---------- 回村结算 ---------- */
function openVillage() {
  const level = panelCtx.level;
  const o = meta.orderCur;
  const g = state.gain;
  const gainText =
    `+${g.f} 🌾食物　+${g.m} ⛏️材料　+${g.r} ✨符文` +
    (state.overflow > 0 ? `　<span class="tag warn">仓库满，损失 ${state.overflow}</span>` : '');
  const clearGold = Math.round((8 + state.level * 2) * goldMult());
  const deliverable = o && canDeliver(o);

  let orderRow;
  if (!o) {
    orderRow = `<div class="p-row"><span>暂无订单</span><span class="dim">下一关会接到新订单</span></div>`;
  } else {
    orderRow = `<div class="p-row">
      <span>🌾×${o.f}　⛏️×${o.m}　✨×${o.r}</span>
      <button class="p-btn" data-act="deliver" ${deliverable ? '' : 'disabled'}>
        ${deliverable ? `交付 +${orderReward(o)}🪙 +2🏅` : '资源不足'}
      </button>
    </div>`;
  }

  const barnCost = 20 + meta.upgrades.barn * 15;
  const workCost = 30 + meta.upgrades.workshop * 20;

  openPanel(`
    <h2>回村结算 🏡</h2>
    <p class="p-sub">第 ${state.level} 关 · 总分 ${state.score} ${state.score >= meta.best ? '· 新纪录！' : ''}</p>

    <div class="p-sec">🎒 本关收获（已入仓库）</div>
    <div class="p-row"><span>${gainText}</span></div>
    <div class="p-row"><span>🪙 通关奖励</span><b>+${clearGold} 金币</b></div>

    <div class="p-sec">📜 订单（${meta.ordersDone} 单已完成）</div>
    ${orderRow}

    <div class="p-sec">🏠 村庄建设</div>
    <div class="p-row">
      <span>🏚️ 谷仓 Lv.${meta.upgrades.barn} <span class="dim">资源上限 ${resCap()}/类</span></span>
      <button class="p-btn" data-act="buy" data-arg="barn" ${meta.gold >= barnCost ? '' : 'disabled'}>升级 ${barnCost}🪙</button>
    </div>
    <div class="p-row">
      <span>🔨 工坊 Lv.${meta.upgrades.workshop} <span class="dim">伙伴偏好加成 ×${crewMult().toFixed(2)}</span></span>
      <button class="p-btn" data-act="buy" data-arg="workshop" ${meta.gold >= workCost ? '' : 'disabled'}>升级 ${workCost}🪙</button>
    </div>

    <div class="p-sec">🧿 道具与伙伴</div>
    <div class="p-row">
      <span>🦉 透视符 ×${meta.items.peek}</span>
      <button class="p-btn" data-act="buy" data-arg="peek" ${meta.gold >= ITEMS.peek.cost ? '' : 'disabled'}>买 ${ITEMS.peek.cost}🪙</button>
    </div>
    <div class="p-row">
      <span>🧿 撤回符 ×${meta.items.guard}</span>
      <button class="p-btn" data-act="buy" data-arg="guard" ${meta.gold >= ITEMS.guard.cost ? '' : 'disabled'}>买 ${ITEMS.guard.cost}🪙</button>
    </div>
    ${Object.entries(CREWS).filter(([k]) => !CREWS[k].owned).map(([k, c]) => `
      <div class="p-row">
        <span>${c.icon} ${c.name} <span class="dim">${c.desc}</span></span>
        ${meta.crew[k]
          ? '<span class="tag">已雇佣 ✔</span>'
          : `<button class="p-btn" data-act="hire" data-arg="${k}" ${meta.gold >= c.cost ? '' : 'disabled'}>雇佣 ${c.cost}🪙</button>`}
      </div>`).join('')}

    <button class="main-btn" style="margin-top:16px" data-act="next">前往下一关 →</button>
  `);
}

/* ---------- 面板动作分发 ---------- */
function handleAct(act, arg) {
  if (act === 'crew') {
    panelCtx.crewKey = arg;
    openPrep();
  } else if (act === 'hint') {
    const c = CREWS[arg];
    openPanel(panelBody.innerHTML); // 防抖动重绘（保持内容）
    panelBody.querySelector('.p-sub').insertAdjacentHTML('afterend',
      `<div class="p-row"><span class="tag warn">${c.name} 还没雇佣：回村在客栈花 ${c.cost}🪙 雇佣</span></div>`);
  } else if (act === 'item') {
    panelCtx.carry[arg] = !panelCtx.carry[arg];
    openPrep();
  } else if (act === 'go') {
    openPassivePick();
  } else if (act === 'pick') {
    closePanel();
    startLevel(panelCtx.level, arg);
  } else if (act === 'deliver') {
    const o = meta.orderCur;
    if (o && canDeliver(o)) {
      for (const c of ['f', 'm', 'r']) meta.res[c] -= o[c];
      meta.gold += orderReward(o);
      meta.rep += 2;
      meta.ordersDone++;
      meta.orderCur = null;
      saveMeta();
      openVillage();
    }
  } else if (act === 'buy') {
    if (arg === 'barn' && meta.gold >= 20 + meta.upgrades.barn * 15) {
      meta.gold -= 20 + meta.upgrades.barn * 15;
      meta.upgrades.barn++;
    } else if (arg === 'workshop' && meta.gold >= 30 + meta.upgrades.workshop * 20) {
      meta.gold -= 30 + meta.upgrades.workshop * 20;
      meta.upgrades.workshop++;
    } else if (ITEMS[arg] && meta.gold >= ITEMS[arg].cost) {
      meta.gold -= ITEMS[arg].cost;
      meta.items[arg]++;
    }
    saveMeta();
    openVillage();
  } else if (act === 'hire') {
    const c = CREWS[arg];
    if (c && !meta.crew[arg] && meta.gold >= c.cost) {
      meta.gold -= c.cost;
      meta.crew[arg] = true;
      saveMeta();
    }
    openVillage();
  } else if (act === 'next') {
    const next = state.level + 1;
    meta.unlocked = Math.max(meta.unlocked, next);
    saveMeta();
    closePanel();
    toPrep(next);
  }
}

panelBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  handleAct(b.dataset.act, b.dataset.arg);
});

/* ================================================================
 *  胜负
 * ================================================================ */

function winLevel() {
  state.playing = false;
  updateProps();
  bankAll();

  // 通关金币
  const clearGold = Math.round((8 + state.level * 2) * goldMult());
  meta.gold += clearGold;
  meta.unlocked = Math.max(meta.unlocked, state.level + 1);
  meta.best = Math.max(meta.best, state.score);
  saveMeta();

  panelCtx.level = state.level;
  setTimeout(() => openVillage(), 350);
}

function loseLevel() {
  state.playing = false;
  updateProps();
  bankAll();

  setTimeout(() => {
    showOverlay({
      emoji: '😵',
      title: '槽位满了…',
      desc: `本关得分：${state.score} 分\n收获的资源已存入仓库。\n还有小羊被困在草堆里，整装再出发！`,
      btnText: '重新准备出发',
      onClick: () => { hideOverlay(); toPrep(state.level); },
    });
  }, 260);
}

/* ================================================================
 *  关卡启动
 * ================================================================ */

function startLevel(level, passiveId) {
  /* --- 1. 应用本关配置（伙伴 / 天气 / 被动 / 道具） --- */
  state.level = level;
  state.passive = passiveId || null;
  state.crewKey = panelCtx.crewKey || 'farmer';
  state.weather = state.weather || 'sunny';
  state.comboWindow = state.weather === 'rain' ? COMBO_WINDOW - 1000 : COMBO_WINDOW;
  state.slotCount = SLOT_COUNT + (state.passive === 'slot' ? 1 : 0);
  state.propMax = { shuffle: 1, undo: state.passive === 'undo' ? 2 : 1, remove: 1 };
  state.carry = { peek: false, guard: false };
  state.guardUsed = false;
  state.gain = { f: 0, m: 0, r: 0 };
  state.overflow = 0;
  state.wildcard = null;

  const ch0 = chapterOf(level);
  if (state.passive === 'wild') {
    // 万能牌：从本关图案池里随机挑一种
    const idx = Math.floor(Math.random() * ch0.emojis.length);
    state.wildcard = ch0.emojis[idx];
  }

  // 消耗品：从仓库扣除并生效
  const wantPeek = state.passive === 'peek' || panelCtx.carry.peek;
  const wantGuard = panelCtx.carry.guard;
  if (panelCtx.carry.peek && meta.items.peek > 0) { meta.items.peek--; state.carry.peek = true; }
  if (panelCtx.carry.guard && meta.items.guard > 0) { meta.items.guard--; state.carry.guard = true; }
  saveMeta();

  /* --- 2. 重置对局状态 --- */
  state.slots = [];
  state.stash = [];
  state.history = [];
  state.propsUsed = {};
  state.playing = false;
  if (level === 1) state.score = 0;
  combo = 0;
  lastMatchAt = 0;
  clearTimeout(comboTimer);
  document.getElementById('combo-badge').classList.add('hidden');

  document.body.dataset.chapter = String(ch0.index);

  cardLayer.innerHTML = '';
  stashEl.classList.add('hidden');
  clearTimeout(resolveTimer);

  /* --- 3. 生成关卡 --- */
  const crewCat = CREWS[state.crewKey].cat;
  const gen = generateLevel(level, crewCat);
  state.cards = gen.cards;
  state.expected = gen.expected;

  /* --- 4. 建格子与卡片 DOM --- */
  buildCells();
  computeSizes();

  for (const card of state.cards) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.width = state.S + 'px';
    el.style.height = state.S + 'px';
    el.style.fontSize = Math.round(state.S * 0.56) + 'px';
    el.style.opacity = '0';
    el.innerHTML = `<span class="face">${card.emoji}</span>`;
    el.addEventListener('click', () => onCardClick(card));
    card.el = el;
    cardLayer.appendChild(el);
  }

  /* --- 5. 初始布局与刷新 --- */
  state.playing = true;
  updateBlocked();
  positionAll(true);
  updateHUD();
  updateProps();

  requestAnimationFrame(() => {
    state.cards.forEach(c => { if (c.el) c.el.style.opacity = '1'; });
  });

  // 透视：被动或携带的道具
  if (wantPeek || state.passive === 'peek') {
    document.body.classList.add('peeking');
    setTimeout(() => document.body.classList.remove('peeking'), 4000);
  }
}

/* ================================================================
 *  全局事件绑定
 * ================================================================ */

document.querySelectorAll('.prop-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.prop;
    if (key === 'shuffle') useShuffle();
    else if (key === 'undo') useUndo();
    else if (key === 'remove') useRemove();
  });
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    computeSizes();
    positionAll(true);
  }, 120);
});

document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* ================================================================
 *  初始化
 * ================================================================ */
(function init() {
  loadMeta();
  buildCells();
  computeSizes();
  updateHUD();

  const STORY =
    '狼群夜袭牧场，羊群四散，村子也断了粮。\n' +
    '你带领一支拾荒小队深入遗迹与矿洞——\n' +
    '点击未被遮挡的卡片放进槽位，凑齐 3 张相同图案即可消除。\n' +
    '不同图案产出不同资源（🌾食物 / ⛏️材料 / ✨符文），\n' +
    '回村交付订单、升级建设，让小队走得更远。\n' +
    '槽位满了就会被击退哦～';

  if (meta.unlocked > 1) {
    showOverlay({
      emoji: '🐑',
      title: '羊了个羊 · 拾荒远征',
      desc: `${STORY}\n\n欢迎回来，队长！已解锁第 ${meta.unlocked} 关，最高分 ${meta.best}。`,
      btnText: `继续远征（第 ${meta.unlocked} 关）`,
      onClick: () => { hideOverlay(); toPrep(meta.unlocked); },
      btn2Text: '从第 1 关出发',
      onClick2: () => { hideOverlay(); toPrep(1); },
    });
  } else {
    showOverlay({
      emoji: '🐑',
      title: '羊了个羊 · 拾荒远征',
      desc: STORY,
      btnText: '组建小队',
      onClick: () => { hideOverlay(); toPrep(1); },
    });
  }
})();
</script>
