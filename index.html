<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>羊了个羊 · 救援记</title>
<style>
/* ============================================================
   全局样式 —— 自然清新配色：米白 / 浅绿 / 木色
   ============================================================ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  color: #4a4033;
  background: var(--bg);
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 章节主题：背景 + 主题色（随关卡切换） ---------- */
body[data-chapter="1"] {
  --bg: linear-gradient(165deg, #fdfaf3 0%, #f3f7ec 55%, #eef3e2 100%);
  --accent: #5f8a4c; --accent-2: #82bd6c; --accent-deep: #6a9c56;
}
body[data-chapter="2"] {
  --bg: linear-gradient(165deg, #f2f6ee 0%, #e2ecdf 50%, #d3e3d6 100%);
  --accent: #4c8a63; --accent-2: #6fae86; --accent-deep: #437a56;
}
body[data-chapter="3"] {
  --bg: linear-gradient(165deg, #f8fbff 0%, #eaf3fb 55%, #dcebf7 100%);
  --accent: #4f83a8; --accent-2: #74add0; --accent-deep: #3f6f92;
}
body[data-chapter="4"] {
  --bg: linear-gradient(165deg, #f5f2fb 0%, #eae5f6 55%, #dcd5f0 100%);
  --accent: #7a6cc4; --accent-2: #9c90dd; --accent-deep: #6356a8;
}

/* ---------- 顶部信息栏 ---------- */
#hud {
  flex: none;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 16px 12px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid #e8e2d3;
  box-shadow: 0 2px 12px rgba(170, 150, 115, 0.07);
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #9c907c;
}

.hud-item b {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* ---------- 棋盘区 ---------- */
#board-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 6px;
}

#board {
  position: relative;
  border-radius: 22px;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
}

/* ---------- 底部：槽位 + 暂存区 + 道具 ---------- */
#bottom {
  flex: none;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid #eae4d5;
  box-shadow: 0 -6px 24px rgba(160, 140, 110, 0.1);
}

#slots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  background: #f0e9da;
  border-radius: 14px;
  box-shadow: inset 0 2px 6px rgba(150, 130, 95, 0.12);
}

.slot-cell {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #e4dbc8;
  box-shadow: inset 0 2px 4px rgba(120, 100, 70, 0.12);
}

#stash {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

#stash.hidden { display: none; }

.stash-cell {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #efe4d3;
  border: 1px dashed #d3c4a8;
}

#props {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.prop-btn {
  flex: 1;
  padding: 11px 2px;
  border: none;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  box-shadow: 0 3px 0 var(--accent-deep), 0 5px 14px rgba(120, 170, 100, 0.32);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease,
              background 0.2s ease, color 0.2s ease;
}

.prop-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 0 0 var(--accent-deep);
}

.prop-btn:disabled {
  background: #ded8ca;
  color: #b0a896;
  box-shadow: none;
  cursor: default;
}

/* ---------- 卡片层（覆盖全屏，用 fixed 定位方便飞行） ---------- */
#card-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

.card {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: linear-gradient(180deg, #fffef9 0%, #f8f2e5 100%);
  border: 1.5px solid #e5dbc7;
  box-shadow: 0 2px 0 rgba(185, 165, 130, 0.4),
              0 3px 8px rgba(150, 130, 100, 0.16);
  pointer-events: auto;
  cursor: pointer;
  will-change: transform;
  transition: transform 0.32s cubic-bezier(0.34, 0.9, 0.4, 1),
              opacity 0.26s ease,
              width 0.15s ease,
              height 0.15s ease,
              font-size 0.15s ease;
}

.card .face {
  display: block;
  line-height: 1;
  transition: transform 0.15s ease;
  pointer-events: none;
}

/* 被遮挡的卡片：变暗 + 禁止点击 */
.card.blocked {
  cursor: default;
}

.card.blocked::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 11px;
  background: rgba(92, 80, 62, 0.46);
  pointer-events: none;
}

/* 点击时的抖动反馈（用于不能点的卡片） */
@keyframes shakeX {
  0%, 100% { margin-left: 0; }
  25% { margin-left: -4px; }
  75% { margin-left: 4px; }
}
.card.shake { animation: shakeX 0.24s ease; }

/* ---------- 飘分文字 ---------- */
.float-text {
  position: fixed;
  transform: translate(-50%, -50%);
  font-size: 24px;
  font-weight: 900;
  color: #f5a623;
  text-shadow: 0 1px 0 #fff, 0 2px 10px rgba(245, 166, 35, 0.6);
  pointer-events: none;
  z-index: 2000;
  animation: floatUp 0.95s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}

@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  25%  { opacity: 1; transform: translate(-50%, -85%) scale(1.25); }
  100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
}

/* ---------- 连击提示（槽位上方，带倒计时条） ---------- */
#combo-badge {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 300;
  padding: 7px 18px 9px;
  border-radius: 999px;
  background: rgba(62, 52, 40, 0.78);
  color: #ffd76a;
  font-size: 14px;
  letter-spacing: 1px;
  text-align: center;
  pointer-events: none;
  box-shadow: 0 4px 14px rgba(60, 48, 30, 0.3);
}

#combo-badge b {
  font-weight: 800;
}

#combo-badge .combo-bar {
  display: block;
  height: 3px;
  margin-top: 4px;
  border-radius: 2px;
  background: #ffd76a;
  width: 100%;
}

#combo-badge.hidden { display: none; }

/* ---------- 遮罩层次要按钮（继续 / 从头开始） ---------- */
.ghost-btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 1.5px solid #d8d0bd;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #9c907c;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ghost-btn:active { background: #f1ecdf; }

#ov-btn2.hidden { display: none; }

/* ---------- 遮罩层（开始 / 胜利 / 失败） ---------- */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(62, 52, 40, 0.42);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#overlay.hidden { display: none; }

.overlay-card {
  width: 100%;
  max-width: 320px;
  padding: 30px 24px 26px;
  text-align: center;
  border-radius: 22px;
  background: linear-gradient(180deg, #fffdf8 0%, #f7f2e5 100%);
  box-shadow: 0 22px 55px rgba(80, 62, 40, 0.28);
  animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.ov-emoji {
  font-size: 54px;
  line-height: 1;
  margin-bottom: 12px;
  animation: bob 2.2s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

.overlay-card h2 {
  margin: 0 0 10px;
  font-size: 23px;
  color: var(--accent);
  letter-spacing: 1px;
}

.overlay-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.7;
  color: #9c907c;
}

.main-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  box-shadow: 0 4px 0 var(--accent-deep), 0 8px 22px rgba(120, 170, 100, 0.38);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.main-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--accent-deep);
}
</style>
</head>
<body data-chapter="1">

<!-- ==================== 顶部信息栏 ==================== -->
<header id="hud">
  <div class="hud-item"><span>关卡</span><b id="level-val">1</b></div>
  <div class="hud-item"><span>剩余</span><b id="remain-val">0</b></div>
  <div class="hud-item"><span>分数</span><b id="score-val">0</b></div>
  <div class="hud-item"><span>最高分</span><b id="best-val">0</b></div>
</header>

<!-- ==================== 卡片堆叠区 ==================== -->
<main id="board-wrap">
  <div id="board"></div>
  <div id="combo-badge" class="hidden"><b id="combo-txt">连击 ×2</b><span class="combo-bar"></span></div>
</main>

<!-- ==================== 底部：槽位 / 暂存区 / 道具 ==================== -->
<footer id="bottom">
  <div id="slots"></div>

  <div id="stash" class="hidden"></div>

  <div id="props">
    <button class="prop-btn" data-prop="shuffle">🔀 洗牌</button>
    <button class="prop-btn" data-prop="undo">↩️ 撤销</button>
    <button class="prop-btn" data-prop="remove">📤 移出</button>
  </div>
</footer>

<!-- 卡片渲染层（fixed 定位，覆盖全屏） -->
<div id="card-layer"></div>

<!-- 遮罩层 -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <div class="ov-emoji" id="ov-emoji">🐑</div>
    <h2 id="ov-title">羊了个羊</h2>
    <p id="ov-desc"></p>
    <button id="ov-btn" class="main-btn">开始游戏</button>
    <button id="ov-btn2" class="ghost-btn hidden">从头开始</button>
  </div>
</div>

<script>
/* ================================================================
 *  羊了个羊 · 救援记
 *  ----------------------------------------------------------------
 *  架构说明：
 *    1. 数据层：state.cards 保存所有卡片的逻辑数据（图案、坐标、状态）
 *    2. 渲染层：每个卡片对应一个 DOM 元素，统一放在 #card-layer 中，
 *               用 transform: translate() 定位，方便做飞行动画
 *    3. 逻辑层：遮挡判定 / 槽位三消 / 道具 / 胜负判断
 *    4. 元游戏：章节地图（每 5 关一章，图案与配色随之切换）/
 *               连击计分（5 秒内连续消除，分数翻倍封顶 8 倍）/
 *               localStorage 存档（解锁进度 + 最高分）
 * ================================================================ */

/* ---------------- 章节配置 ----------------
   每 5 关一个章节，各有专属图案池与配色；
   走完 4 章后主题循环，难度仍随关卡数增长 */
const LEVELS_PER_CHAPTER = 5;

const CHAPTERS = [
  {
    name: '青青草原',
    intro: '故事开始的地方。\n狼群刚刚离去，草堆下还藏着第一批小羊。',
    emojis: ['🐑', '🌿', '🥕', '🍎', '🌻', '🪵', '🧶', '🍄'],
  },
  {
    name: '迷雾森林',
    intro: '羊群逃进了迷雾森林，\n藤蔓和蘑菇盖住了它们的踪迹……',
    emojis: ['🐑', '🌲', '🍄', '🌰', '🍓', '🐿️', '🪵', '🦔'],
  },
  {
    name: '雪山之巅',
    intro: '风雪越来越大了，\n小羊们挤在一起取暖。快找到它们！',
    emojis: ['🐑', '❄️', '⛄', '🧣', '🧤', '🏔️', '☕', '🌲'],
  },
  {
    name: '月光山谷',
    intro: '月亮升起来了。\n听说狼王就住在这片山谷——小心！',
    emojis: ['🐑', '🌙', '⭐', '🦉', '🍇', '🕯️', '🔮', '💐'],
  },
];

/** 关卡所属章节（主题按 4 章循环，num 一直递增） */
function chapterOf(level) {
  const idx = Math.floor((level - 1) / LEVELS_PER_CHAPTER) % CHAPTERS.length;
  const num = Math.floor((level - 1) / LEVELS_PER_CHAPTER) + 1;
  return { ...CHAPTERS[idx], index: idx + 1, num };
}

/* ---------------- 常量配置 ---------------- */
const GRID = 7;                 // 棋盘网格边长（每层 7×7 个落点）
const SLOT_COUNT = 7;           // 槽位数量
const STASH_COUNT = 3;          // 暂存区数量
const OVERLAP_THRESHOLD = 0.06; // 遮挡判定阈值（重叠面积 / 单卡面积）
const FLY_DURATION = 340;       // 飞入槽位的动画时长（ms）
const COMBO_WINDOW = 5000;      // 连击有效窗口（ms），窗口内连续消除分数翻倍
const SAVE_KEY = 'sheep_rescue_save_v1';  // localStorage 存档键

/* ---------------- 游戏状态 ---------------- */
const state = {
  level: 1,          // 当前关卡
  score: 0,          // 分数
  cards: [],         // 全部卡片数据
  slots: [],         // 槽位中的卡片（有序，按图案分组）
  stash: [],         // 暂存区中的卡片
  history: [],       // 撤销用的历史记录
  propsUsed: {},     // 道具使用情况 { shuffle, undo, remove }
  playing: false,    // 是否处于游戏中
  S: 42,             // 卡片尺寸（px），布局时动态计算
};

/* ---------------- 存档与连击 ---------------- */
let save = { unlocked: 1, best: 0 };  // 本地存档：已解锁关卡 / 最高分
let combo = 0;                        // 当前连击数
let lastMatchAt = 0;                  // 上一次消除的时间戳
let comboTimer = null;                // 连击提示条的隐藏计时器

/* ---------------- DOM 引用 ---------------- */
const cardLayer = document.getElementById('card-layer');
const boardEl   = document.getElementById('board');
const boardWrap = document.getElementById('board-wrap');
const slotsEl   = document.getElementById('slots');
const stashEl   = document.getElementById('stash');
const overlayEl = document.getElementById('overlay');

/* ================================================================
 *  工具函数
 * ================================================================ */

/** Fisher–Yates 洗牌 */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 读取本地存档（隐私模式等场景下静默降级为不存档） */
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      save.unlocked = Math.max(1, d.unlocked | 0);
      save.best = Math.max(0, d.best | 0);
    }
  } catch (e) { /* 存档不可用时忽略，不影响游戏 */ }
  return save;
}

/** 写入本地存档 */
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

/** 创建槽位与暂存区的空格子 */
function buildCells() {
  slotsEl.innerHTML = '';
  for (let i = 0; i < SLOT_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'slot-cell';
    slotsEl.appendChild(d);
  }
  stashEl.innerHTML = '';
  for (let i = 0; i < STASH_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'stash-cell';
    stashEl.appendChild(d);
  }
}

/* ================================================================
 *  关卡生成 —— 纯数据，不涉及 DOM
 * ================================================================ */

/**
 * 生成一关的卡片数据
 * 规则：
 *   - 卡片总数是 3 的倍数
 *   - 每种图案的数量也是 3 的倍数（保证一定能全部消完）
 *   - 按层堆叠，每层有随机偏移，形成遮挡
 */
function generateLevel(level) {
  const pool = chapterOf(level).emojis;  // 本章节的图案池

  /* --- 1. 计算卡片总数与层数 --- */
  let total = 60 + (level - 1) * 18;   // 第一关 60 张，之后每关 +18
  total = Math.min(total, 180);        // 上限，避免手机卡顿
  total -= total % 3;                  // 确保是 3 的倍数

  const layers = Math.min(3 + Math.floor((level - 1) / 2), 6); // 3 → 6 层

  /* --- 2. 把卡片数平均分到各层 --- */
  const perLayer = [];
  let left = total;
  for (let i = 0; i < layers; i++) {
    const n = Math.min(Math.ceil(left / (layers - i)), GRID * GRID);
    perLayer.push(n);
    left -= n;
  }

  /* --- 3. 每层一个随机偏移（半格以内），制造层间错位遮挡 --- */
  const layerOffsets = [];
  for (let i = 0; i < layers; i++) {
    layerOffsets.push([
      (Math.random() - 0.5) * 0.6,  // 横向偏移 -0.3 ~ 0.3 格
      (Math.random() - 0.5) * 0.6,  // 纵向偏移
    ]);
  }

  /* --- 4. 为每层随机挑选网格落点 --- */
  const allCells = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) allCells.push([x, y]);
  }

  const positions = [];
  for (let l = 0; l < layers; l++) {
    const pool = shuffle(allCells.slice());
    for (let i = 0; i < perLayer[l]; i++) {
      const [gx, gy] = pool[i % pool.length];
      positions.push({
        layer: l,
        gx, gy,
        ox: layerOffsets[l][0],
        oy: layerOffsets[l][1],
      });
    }
  }

  /* --- 5. 分配图案：以「三张一组」为单位分配，保证每种图案都是 3 的倍数 --- */
  const totalCards = positions.length;
  const triples = totalCards / 3;
  const kinds = Math.max(3, Math.min(pool.length, Math.round(triples / 3.5)));

  // 每种图案分到多少组（尽量平均）
  const groups = new Array(kinds).fill(0);
  for (let i = 0; i < triples; i++) groups[i % kinds]++;

  const emojiList = [];
  for (let i = 0; i < kinds; i++) {
    for (let j = 0; j < groups[i] * 3; j++) emojiList.push(pool[i]);
  }
  shuffle(emojiList);

  /* --- 6. 组装卡片数据 --- */
  return positions.map((p, i) => ({
    id: i,
    emoji: emojiList[i],
    layer: p.layer,
    gx: p.gx,
    gy: p.gy,
    ox: p.ox,
    oy: p.oy,
    state: 'board',   // board | slot | stash | removed
    blocked: false,
    el: null,
  }));
}

/* ================================================================
 *  尺寸计算与布局
 * ================================================================ */

/** 根据可用空间计算卡片尺寸、棋盘尺寸、槽位格子尺寸 */
function computeSizes() {
  const wrapW = boardWrap.clientWidth - 12;
  const wrapH = boardWrap.clientHeight - 12;

  // 槽位宽度约束：7 个格子 + 6 个间隙 + 左右 padding
  const slotAvail = Math.min(window.innerWidth - 32, 420);
  const gap = 6;
  const sFromSlot = Math.floor((slotAvail - gap * (SLOT_COUNT - 1) - 16) / SLOT_COUNT);

  // 棋盘按 7.6 格宽度预留（给层偏移留出余量）
  let S = Math.floor(Math.min(wrapW / 7.6, wrapH / 7.6, sFromSlot));
  S = Math.max(24, Math.min(54, S));

  state.S = S;

  // 棋盘尺寸
  boardEl.style.width = S * GRID + 'px';
  boardEl.style.height = S * GRID + 'px';

  // 槽位 / 暂存区格子尺寸
  document.querySelectorAll('.slot-cell, .stash-cell').forEach(el => {
    el.style.width = S + 'px';
    el.style.height = S + 'px';
  });

  // 同步已有卡片尺寸
  for (const card of state.cards) {
    if (!card.el) continue;
    card.el.style.width = S + 'px';
    card.el.style.height = S + 'px';
    card.el.style.fontSize = Math.round(S * 0.56) + 'px';
  }
}

/**
 * 重新计算所有卡片的位置并应用
 * @param {boolean} instant 是否禁用过渡（用于首次布局）
 */
function positionAll(instant = false) {
  const S = state.S;
  const br = boardEl.getBoundingClientRect();

  // 槽位 / 暂存区各格子的屏幕坐标
  const slotRects  = [...document.querySelectorAll('.slot-cell')].map(el => el.getBoundingClientRect());
  const stashRects = [...document.querySelectorAll('.stash-cell')].map(el => el.getBoundingClientRect());

  if (instant) {
    for (const c of state.cards) if (c.el) c.el.style.transition = 'none';
  }

  for (const card of state.cards) {
    if (card.state === 'removed' || !card.el) continue;
    const el = card.el;

    let x = 0, y = 0, z = 0;

    if (card.state === 'board') {
      // 棋盘上的卡片：网格坐标 + 层偏移
      x = br.left + card.gx * S + card.ox * S;
      y = br.top  + card.gy * S + card.oy * S;
      z = 10 + card.layer * 10;

    } else if (card.state === 'slot') {
      // 槽位中的卡片：按它在数组中的位置对齐格子
      const i = state.slots.indexOf(card);
      const r = slotRects[i];
      if (r) { x = r.left; y = r.top; }
      z = 600 + i;

    } else if (card.state === 'stash') {
      const i = state.stash.indexOf(card);
      const r = stashRects[i];
      if (r) { x = r.left; y = r.top; }
      z = 500 + i;
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.zIndex = z;
  }

  if (instant) {
    requestAnimationFrame(() => {
      for (const c of state.cards) if (c.el) c.el.style.transition = '';
    });
  }
}

/* ================================================================
 *  遮挡判定
 * ================================================================ */

/**
 * 判断某张卡片是否被上层卡片遮挡
 * 原理：与所有层数更高的卡片做矩形重叠面积比较
 */
function isCardBlocked(card, boardCards) {
  for (const other of boardCards) {
    if (other === card) continue;
    if (other.layer <= card.layer) continue; // 只看更高层

    // 用「格」为单位计算矩形（含层偏移）
    const ax = card.gx + card.ox,  ay = card.gy + card.oy;
    const bx = other.gx + other.ox, by = other.gy + other.oy;

    const dx = Math.min(ax + 1, bx + 1) - Math.max(ax, bx);
    const dy = Math.min(ay + 1, by + 1) - Math.max(ay, by);

    if (dx > 0 && dy > 0 && dx * dy > OVERLAP_THRESHOLD) return true;
  }
  return false;
}

/** 刷新所有棋盘卡片的遮挡状态 */
function updateBlocked() {
  const boardCards = state.cards.filter(c => c.state === 'board');
  for (const card of boardCards) {
    const blocked = isCardBlocked(card, boardCards);
    card.blocked = blocked;
    if (card.el) card.el.classList.toggle('blocked', blocked);
  }
}

/* ================================================================
 *  槽位逻辑
 * ================================================================ */

/** 把卡片插入槽位（相同图案自动挨在一起） */
function insertIntoSlot(card) {
  let idx = -1;
  for (let i = state.slots.length - 1; i >= 0; i--) {
    if (state.slots[i].emoji === card.emoji) { idx = i; break; }
  }
  if (idx === -1) state.slots.push(card);
  else state.slots.splice(idx + 1, 0, card);
}

let resolveTimer = null;

/** 延迟触发结算（等飞行动画播完） */
function scheduleResolve() {
  clearTimeout(resolveTimer);
  resolveTimer = setTimeout(() => {
    resolveTimer = null;
    resolveSlots();
  }, FLY_DURATION);
}

/** 检查槽位中是否有 3 张相同图案 */
function resolveSlots() {
  if (!state.playing && state.cards.length === 0) return;

  // 统计
  const count = {};
  for (const c of state.slots) count[c.emoji] = (count[c.emoji] || 0) + 1;

  let target = null;
  for (const e in count) {
    if (count[e] >= 3) { target = e; break; }
  }

  if (target) {
    // ---- 找出 3 张相同卡片 ----
    const matched = [];
    for (const c of state.slots) {
      if (c.emoji === target && matched.length < 3) matched.push(c);
    }
    state.slots = state.slots.filter(c => !matched.includes(c));

    // ---- 消除动画 ----
    for (const c of matched) {
      c.state = 'removed';
      c.el.style.transform += ' scale(0.15)';
      c.el.style.opacity = '0';
      c.el.style.pointerEvents = 'none';
    }

    // ---- 连击判定 + 计分 ----
    const now = Date.now();
    combo = (now - lastMatchAt <= COMBO_WINDOW) ? combo + 1 : 1;
    lastMatchAt = now;

    // 连击倍率：1 / 2 / 4 / 8 倍封顶（+30 / +60 / +120 / +240）
    const points = 30 * Math.pow(2, Math.min(combo - 1, 3));
    state.score += points;

    // 分数实时计入存档（中途退出也不丢最高分）
    if (state.score > save.best) {
      save.best = state.score;
      writeSave();
    }

    const sr = slotsEl.getBoundingClientRect();
    showFloat(combo > 1 ? `+${points} 连击×${combo}` : `+${points}`,
              sr.left + sr.width / 2, sr.top - 6);
    if (combo > 1) showComboBadge(combo);

    updateHUD();

    // ---- 动画结束后清理 DOM 并递归检查 ----
    setTimeout(() => {
      matched.forEach(c => { c.el.remove(); c.el = null; });
      positionAll();
      updateHUD();
      afterResolve();
      // 递归：理论上不会有第二组，但保险起见
      if (state.slots.length >= 3) resolveSlots();
    }, 300);

  } else {
    afterResolve();
  }
}

/** 结算后的胜负判断 */
function afterResolve() {
  if (!state.playing) return;

  const remaining = state.cards.filter(c => c.state !== 'removed').length;
  if (remaining === 0) {
    winLevel();
    return;
  }
  if (state.slots.length >= SLOT_COUNT) {
    loseLevel();
  }
}

/* ================================================================
 *  飘分文字
 * ================================================================ */
function showFloat(text, x, y) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

/* ================================================================
 *  连击提示条（显示倍率 + 剩余时间）
 * ================================================================ */
function showComboBadge(n) {
  const badge = document.getElementById('combo-badge');
  const txt = document.getElementById('combo-txt');
  const bar = badge.querySelector('.combo-bar');

  txt.textContent = `连击 ×${n}`;
  badge.classList.remove('hidden');

  // 倒计时条：从满到空表示连击剩余时间
  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => {
    bar.style.transition = `width ${COMBO_WINDOW}ms linear`;
    bar.style.width = '0%';
  });

  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => badge.classList.add('hidden'), COMBO_WINDOW);
}

/* ================================================================
 *  HUD 与道具按钮状态
 * ================================================================ */
function updateHUD() {
  document.getElementById('level-val').textContent = state.level;
  document.getElementById('remain-val').textContent =
    state.cards.filter(c => c.state !== 'removed').length;
  document.getElementById('score-val').textContent = state.score;
  document.getElementById('best-val').textContent = save.best;
}

function updateProps() {
  document.querySelectorAll('.prop-btn').forEach(btn => {
    const key = btn.dataset.prop;
    btn.disabled = !state.playing || !!state.propsUsed[key];
  });
}

/* ================================================================
 *  卡片交互
 * ================================================================ */

/** 统一的卡片点击入口 */
function onCardClick(card) {
  if (!state.playing) return;
  // 弹窗刚关闭的 250ms 内忽略：防止连点按钮时误选卡片
  if (Date.now() - overlayHiddenAt < 250) return;

  if (card.state === 'board') {
    handleBoardCardClick(card);
  } else if (card.state === 'stash') {
    handleStashCardClick(card);
  }
}

/** 点击棋盘上的卡片 */
function handleBoardCardClick(card) {
  // 被遮挡 → 抖一下表示不能点
  if (card.blocked) {
    card.el.classList.remove('shake');
    void card.el.offsetWidth; // 触发重排以重启动画
    card.el.classList.add('shake');
    setTimeout(() => card.el.classList.remove('shake'), 260);
    return;
  }

  // 槽位已满 → 忽略
  if (state.slots.length >= SLOT_COUNT) return;

  // 记录历史（用于撤销）
  state.history.push({
    card,
    gx: card.gx, gy: card.gy,
    ox: card.ox, oy: card.oy,
    layer: card.layer,
  });

  // 点按缩放反馈
  const face = card.el.querySelector('.face');
  if (face) {
    face.style.transform = 'scale(1.3)';
    setTimeout(() => { if (face) face.style.transform = ''; }, 150);
  }

  // 移入槽位
  card.state = 'slot';
  insertIntoSlot(card);

  updateBlocked();
  positionAll();
  updateHUD();

  scheduleResolve();
}

/** 点击暂存区的卡片：有空间则放回槽位 */
function handleStashCardClick(card) {
  if (state.slots.length >= SLOT_COUNT) return;

  const i = state.stash.indexOf(card);
  if (i === -1) return;
  state.stash.splice(i, 1);

  card.state = 'slot';
  insertIntoSlot(card);

  if (state.stash.length === 0) {
    stashEl.classList.add('hidden');
    // 布局变化后重新计算尺寸
    requestAnimationFrame(() => {
      computeSizes();
      positionAll();
    });
  }

  updateBlocked();
  positionAll();
  updateHUD();
  scheduleResolve();
}

/* ================================================================
 *  道具系统
 * ================================================================ */

/** 洗牌：重新随机分配场上剩余卡片的图案（位置不变） */
function useShuffle() {
  if (!state.playing || state.propsUsed.shuffle) return;

  const boardCards = state.cards.filter(c => c.state === 'board');
  if (boardCards.length < 2) return;

  state.propsUsed.shuffle = true;

  const emojis = boardCards.map(c => c.emoji);
  shuffle(emojis);

  boardCards.forEach((c, i) => {
    c.emoji = emojis[i];
    const face = c.el.querySelector('.face');
    if (face) face.textContent = emojis[i];
    // 闪一下，给玩家反馈
    c.el.style.transform += ' scale(0.85)';
    setTimeout(() => {
      c.el.style.transform = c.el.style.transform.replace(' scale(0.85)', '');
    }, 150);
  });

  // 洗牌后清空历史，避免撤销出问题
  state.history = state.history.filter(h => h.card.state === 'board');

  updateProps();
  updateBlocked();
}

/** 撤销：把槽位里最后一张卡片退回它原来的位置 */
function useUndo() {
  if (!state.playing || state.propsUsed.undo) return;
  if (state.slots.length === 0) return;

  // 从历史中找最近一张仍在槽位里的卡片
  let rec = null;
  while (state.history.length) {
    const r = state.history[state.history.length - 1];
    if (state.slots.includes(r.card)) { rec = state.history.pop(); break; }
    state.history.pop(); // 已经不在槽位了，丢弃这条记录
  }
  if (!rec) return;

  state.propsUsed.undo = true;

  const card = rec.card;
  const idx = state.slots.indexOf(card);
  if (idx !== -1) state.slots.splice(idx, 1);

  // 恢复卡片到棋盘
  card.state = 'board';
  card.gx = rec.gx;
  card.gy = rec.gy;
  card.ox = rec.ox;
  card.oy = rec.oy;
  card.layer = rec.layer;

  updateBlocked();
  positionAll();
  updateHUD();
  updateProps();
}

/** 移出：把槽位最左边的 3 张卡片移到暂存区 */
function useRemove() {
  if (!state.playing || state.propsUsed.remove) return;
  if (state.slots.length === 0) return;

  state.propsUsed.remove = true;

  const moving = state.slots.splice(0, Math.min(3, state.slots.length));
  moving.forEach(c => {
    c.state = 'stash';
    state.stash.push(c);
  });

  stashEl.classList.remove('hidden');

  // 让浏览器先完成布局，再计算位置
  requestAnimationFrame(() => {
    computeSizes();
    positionAll();
  });

  updateBlocked();
  updateHUD();
  updateProps();
}

/* ================================================================
 *  胜负与遮罩层
 * ================================================================ */

/** 显示遮罩层（btn2Text / onClick2 可选，用于「继续 / 从头开始」双按钮） */
let overlayShownAt = 0;   // 弹窗出现时间，用于双击防误触
let overlayHiddenAt = 0;  // 弹窗关闭时间，防止双击误点到底部卡片

function showOverlay({ emoji, title, desc, btnText, onClick, btn2Text, onClick2 }) {
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-desc').textContent = desc;

  const btn = document.getElementById('ov-btn');
  btn.textContent = btnText;
  // 替换按钮（清除旧监听）
  const fresh = btn.cloneNode(true);
  btn.parentNode.replaceChild(fresh, btn);
  // 弹窗刚出现的 300ms 内忽略点击：防止双击穿过弹窗（如跳过章节剧情）
  const guard = fn => () => {
    if (Date.now() - overlayShownAt < 300) return;
    overlayHiddenAt = Date.now();
    fn();
  };
  fresh.addEventListener('click', guard(onClick));

  const btn2 = document.getElementById('ov-btn2');
  const fresh2 = btn2.cloneNode(true);
  btn2.parentNode.replaceChild(fresh2, btn2);
  if (btn2Text) {
    fresh2.textContent = btn2Text;
    fresh2.addEventListener('click', guard(onClick2));
    fresh2.classList.remove('hidden');
  } else {
    fresh2.classList.add('hidden');
  }

  overlayShownAt = Date.now();
  overlayEl.classList.remove('hidden');
}

function hideOverlay() {
  overlayEl.classList.add('hidden');
}

/** 过关 */
function winLevel() {
  state.playing = false;
  updateProps();

  // 解锁下一关并写存档
  save.unlocked = Math.max(save.unlocked, state.level + 1);
  save.best = Math.max(save.best, state.score);
  writeSave();

  const cur = chapterOf(state.level);
  const next = chapterOf(state.level + 1);
  const isNewChapter = next.num !== cur.num;

  setTimeout(() => {
    showOverlay({
      emoji: '🎉',
      title: `第 ${state.level} 关通关！`,
      desc: (isNewChapter ? `狼群带着剩余的小羊往${next.name}逃去了……\n` : '') +
            `当前总分：${state.score} 分\n下一关卡片会更多哦～`,
      btnText: isNewChapter ? `追去第 ${next.num} 章 · ${next.name}` : '下一关',
      onClick: () => {
        hideOverlay();
        if (isNewChapter) showChapterIntro(next, state.level + 1);
        else startLevel(state.level + 1);
      },
    });
  }, 260);
}

/** 章节开场的剧情过场 */
function showChapterIntro(ch, level) {
  const emoji = ['🌾', '🌲', '🏔️', '🌙'][ch.index - 1];
  showOverlay({
    emoji,
    title: `第 ${ch.num} 章 · ${ch.name}`,
    desc: ch.intro,
    btnText: '开始营救',
    onClick: () => { hideOverlay(); startLevel(level); },
  });
}

/** 失败 */
function loseLevel() {
  state.playing = false;
  updateProps();
  setTimeout(() => {
    showOverlay({
      emoji: '😵',
      title: '槽位满了…',
      desc: `本局得分：${state.score} 分\n还有小羊被困在草堆里，再试一次吧！`,
      btnText: '再来一局',
      onClick: () => { hideOverlay(); startLevel(state.level); },
    });
  }, 260);
}

/* ================================================================
 *  关卡启动
 * ================================================================ */
function startLevel(level) {
  /* --- 1. 重置状态 --- */
  state.level = level;
  state.slots = [];
  state.stash = [];
  state.history = [];
  state.propsUsed = { shuffle: false, undo: false, remove: false };
  state.playing = false;

  if (level === 1) state.score = 0;

  // 章节主题与连击重置
  const ch = chapterOf(level);
  document.body.dataset.chapter = String(ch.index);
  combo = 0;
  lastMatchAt = 0;
  clearTimeout(comboTimer);
  document.getElementById('combo-badge').classList.add('hidden');

  cardLayer.innerHTML = '';
  stashEl.classList.add('hidden');
  clearTimeout(resolveTimer);

  /* --- 2. 生成关卡数据 --- */
  state.cards = generateLevel(level);

  /* --- 3. 计算尺寸 --- */
  computeSizes();

  /* --- 4. 创建卡片 DOM --- */
  for (const card of state.cards) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.width = state.S + 'px';
    el.style.height = state.S + 'px';
    el.style.fontSize = Math.round(state.S * 0.56) + 'px';
    el.style.opacity = '0';
    el.innerHTML = `<span class="face">${card.emoji}</span>`;
    el.addEventListener('click', () => onCardClick(card));
    card.el = el;
    cardLayer.appendChild(el);
  }

  /* --- 5. 初始布局与状态刷新 --- */
  state.playing = true;

  updateBlocked();
  positionAll(true);
  updateHUD();
  updateProps();

  // 淡入
  requestAnimationFrame(() => {
    state.cards.forEach(c => { if (c.el) c.el.style.opacity = '1'; });
  });
}

/* ================================================================
 *  全局事件绑定
 * ================================================================ */

// 道具按钮
document.querySelectorAll('.prop-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.prop;
    if (key === 'shuffle') useShuffle();
    else if (key === 'undo') useUndo();
    else if (key === 'remove') useRemove();
  });
});

// 窗口尺寸变化
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    computeSizes();
    positionAll(true);
  }, 120);
});

// 防止移动端双击缩放
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* ================================================================
 *  初始化
 * ================================================================ */
(function init() {
  buildCells();
  computeSizes();
  loadSave();
  updateHUD();

  // 开场剧情：老玩家可以直接继续，新手从第一关开始
  const STORY = '深夜，大灰狼闯进羊村，把羊群冲散在草堆里。\n你是牧场的小小牧羊人——\n点击未被遮挡的卡片放进下方槽位，\n凑齐 3 张相同图案就能救出小羊。\n槽位满 7 张就失败啦～';

  if (save.unlocked > 1) {
    showOverlay({
      emoji: '🐑',
      title: '羊了个羊 · 救援记',
      desc: `${STORY}\n\n欢迎回来！已解锁第 ${save.unlocked} 关，最高分 ${save.best}。`,
      btnText: `继续营救（第 ${save.unlocked} 关）`,
      onClick: () => { hideOverlay(); startLevel(save.unlocked); },
      btn2Text: '从头开始',
      onClick2: () => { hideOverlay(); startLevel(1); },
    });
  } else {
    showOverlay({
      emoji: '🐑',
      title: '羊了个羊 · 救援记',
      desc: STORY,
      btnText: '开始营救',
      onClick: () => { hideOverlay(); startLevel(1); },
    });
  }
})();
</script>
